[package]
name = "cmsg-foyer-fixture"
version = "0.0.0"
edition = "2024"
publish = false

# The real server graph is intentionally separate from the production client.
# Its development-only gate must never appear in generated local API artifacts.
[workspace]
resolver = "3"

[dependencies]
cvld = { git = "https://github.com/corbet-libs/cvld", branch = "main", default-features = false, features = ["development-gate", "client-http"] }
cmty = { git = "https://github.com/corbet-libs/cmty", branch = "main" }
cpsd = { git = "https://github.com/corbet-foss/cpsd", branch = "main", default-features = false, features = ["storage"] }
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", features = ["libsql"] }
cglb = { git = "https://github.com/corbet-libs/cglb", branch = "main" }
ckyh = { git = "https://github.com/corbet-foss/ckyh", branch = "main" }
cvch = { git = "https://github.com/corbet-foss/cvch", branch = "main" }
cpns = { git = "https://github.com/corbet-foss/cpns", branch = "main" }
ed25519-dalek = "2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softtoken"] }
passkey = "0.4"
async-trait = "0.1"
futures-util = "0.3"

[[bin]]
name = "cmsg-foyer-fixture"
path = "main.rs"
