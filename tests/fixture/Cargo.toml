[package]
name = "cmsg-foyer-fixture"
version = "0.0.0"
edition = "2024"
publish = false

# The real server graph is intentionally separate from the production client.
# Its development-only gate must never appear in generated local API artifacts.
[workspace]
resolver = "3"

[dependencies]
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main" }
crgs = { git = "https://git.corbet.ch/corbet-foss/crgs", branch = "main" }
cvld = { git = "https://git.corbet.ch/corbet-libs/cvld", branch = "main", default-features = false, features = ["development-gate", "client-http"] }
cmty = { git = "https://git.corbet.ch/corbet-libs/cmty", branch = "main" }
cpsd = { git = "https://git.corbet.ch/corbet-foss/cpsd", branch = "main", default-features = false, features = ["storage"] }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", features = ["libsql"] }
cgbl = { git = "https://git.corbet.ch/corbet-libs/cgbl.git", branch = "main" }
ckyh = { git = "https://git.corbet.ch/corbet-foss/ckyh", branch = "main" }
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch", branch = "main" }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns", branch = "main" }
ed25519-dalek = "2"
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softtoken"] }
passkey = "0.4"
async-trait = "0.1"
futures-util = "0.3"

[[bin]]
name = "cmsg-foyer-fixture"
path = "service.rs"

[[bin]]
name = "cmsg-acceptance-fixture"
path = "acceptance.rs"
