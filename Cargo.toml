[package]
autotests = false
name = "cmsg"
version = "0.2.0"
edition = "2021"
rust-version = "1.97"
description = "Device-local Member door and generated client projections"
repository = "https://git.corbet.ch/corbet-fsl/cmsg.git"
license-file = "LICENSE.md"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE.md",
    "README.md",
    "src/**",
    "tests/**",
    "examples/**/*.rs",
    "docs/*.md",
]

# Only these changed library branches need resolution beyond the retained Crow
# snapshot. Clear after promoting their resulting lock; this is not a second
# dependency selection (direct v01 dependencies remain authoritative).
[package.metadata.v01]
refresh = ["cfyr"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cblv = { git = "https://git.corbet.ch/corbet-libre/cblv.git", branch = "main", optional = true }
crbk = { git = "https://git.corbet.ch/corbet-libre/crbk.git", branch = "main", default-features = false }
cblc = { git = "https://git.corbet.ch/corbet-fsl/cblc.git", branch = "main", default-features = false, features = ["publication"] }
cwlt = { git = "https://git.corbet.ch/corbet-foss/cwlt.git", branch = "main", default-features = false, features = ["passport", "wave", "schema"] }
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp.git", branch = "main" }
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main", default-features = false }
cchr = { git = "https://git.corbet.ch/corbet-libre/cchr.git", branch = "main" }
cpfl = { git = "https://git.corbet.ch/corbet-libre/cpfl.git", branch = "main" }
cshm = { git = "https://git.corbet.ch/corbet-libre/cshm.git", branch = "main" }
cmmr = { git = "https://git.corbet.ch/corbet-libre/cmmr.git", branch = "main" }
cdht = { git = "https://git.corbet.ch/corbet-libre/cdht.git", branch = "main" }
cmsh = { git = "https://git.corbet.ch/corbet-fsl/cmsh.git", branch = "main" }
# os-keyring: the native persistent unlock keeps its wrapping key in the OS key store
# (cvlt pulls keyring only for Linux and Apple targets, never for wasm).
cvlt = { git = "https://git.corbet.ch/corbet-fsl/cvlt.git", branch = "main", features = ["wallet", "os-keyring"] }
cnbx = { git = "https://git.corbet.ch/corbet-fsl/cnbx.git", branch = "main" }
ctcs = { git = "https://git.corbet.ch/corbet-libre/ctcs.git", branch = "main" }
cthr = { git = "https://git.corbet.ch/corbet-libre/cthr.git", branch = "main" }
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main", features = ["profile-envelope"] }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst.git", branch = "main" }
ctnd = { git = "https://git.corbet.ch/corbet-libre/ctnd.git", branch = "main" }
schemars = "1"
url = "2"
getrandom = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
data-encoding = "2.9"
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch.git", branch = "main" }
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpky = { git = "https://git.corbet.ch/corbet-libre/cpky.git", branch = "main", optional = true, features = ["embedded-authenticator"] }
ctrn = { git = "https://git.corbet.ch/corbet-foss/ctrn.git", branch = "main", optional = true }
cvfy = { git = "https://git.corbet.ch/corbet-foss/cvfy.git", branch = "main", optional = true }
arti-client = { version = "0.46", default-features = false, optional = true }
tor-rtcompat = { version = "0.46", default-features = false, features = ["tokio", "rustls"], optional = true }
tor-hscrypto = { version = "0.46", default-features = false, optional = true }
tor-llcrypto = { version = "0.46", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
cbrd = { git = "https://git.corbet.ch/corbet-fsl/cbrd.git", branch = "main", default-features = false, features = ["http"] }
futures-util = "0.3"
cfyr = { git = "https://git.corbet.ch/corbet-fsl/cfyr.git", branch = "main", default-features = false, features = ["http"] }
reqwest = { version = "0.13", default-features = false }
axum = "0.8"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cblv = { git = "https://git.corbet.ch/corbet-libre/cblv.git", branch = "main", features = ["browser"], optional = true }
ctrn = { git = "https://git.corbet.ch/corbet-foss/ctrn.git", branch = "main", default-features = false, optional = true }
cbrd = { git = "https://git.corbet.ch/corbet-fsl/cbrd.git", branch = "main", default-features = false, features = ["browser"] }
futures-channel = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Event", "EventTarget", "MessageEvent", "MessageChannel", "MessagePort", "Request", "RequestInit", "RequestMode", "RequestCredentials", "Response"] }
cfyr = { git = "https://git.corbet.ch/corbet-fsl/cfyr.git", branch = "main", default-features = false, features = ["browser"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
cmsg = { path = ".", features = ["client-version-fixture"] }
cpky = { git = "https://git.corbet.ch/corbet-libre/cpky.git", branch = "main", features = ["test-authenticator"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
futures-util = "0.3"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }
browser-coverage-runtime = { package = "browser-coverage-runtime-cmsg", path = ".ci/coverage-runtime" }
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cvld-client = { git = "https://git.corbet.ch/corbet-fsl/cvld.git", branch = "main", default-features = false, features = ["development-gate-client", "client-http"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
tempfile = "3"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = "2"
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", default-features = false, features = ["volatile-signer"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main", default-features = false, features = ["server"] }
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main" }
futures-executor = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
blind-rsa-signatures = { version = "0.18", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[features]
# Member-to-server calls through Oblivious HTTP instead of direct HTTPS (streams excepted).
ohttp = ["cfyr/ohttp", "cbrd/ohttp", "dep:cblv", "cblv/client", "reqwest/rustls-no-provider"]
embedded-authenticator = ["dep:cpky"]
conformance = []
native-prover = ["cwlt/native-prover", "cwlt/native-verifier", "dep:cvfy", "czkp/native", "cvlt/wallet-native-prover", "ckmg/wallet-native-prover"]
# The browser prover (Web Worker behind the engine's ProofWorker port); wasm32 only in production.
browser-prover = ["cwlt/browser-prover", "cvlt/wallet-browser-prover", "ckmg/wallet-browser-prover"]
# Test only: probe exports for the wasm32 browser tests of the prover path; never part of a product build.
browser-prover-probe = ["browser-prover", "ckmg/wallet-browser-prover-probe"]
native-tor = ["ckmg/native-tor", "cmsh/tor", "cmsh/tor-records", "dep:ctrn", "dep:arti-client", "dep:tor-rtcompat", "dep:tor-hscrypto", "dep:tor-llcrypto"]
# Test/fixture only: a private Tor network supplied by embedding code. Production builds never enable it.
# It also switches on device-side cause logging here and in the cfyr/ckmg dependencies
# (the e2e device build enables this feature through the composer's `composer` feature).
private-tor-fixture = ["native-tor", "cfyr/development-gate", "ckmg/development-gate"]
# Test only: named interruption points in the composer (door::interrupt) for kill-and-resume
# harnesses. Production builds never enable it.
interrupt-points = []
# Test only: run a future as an older client (`door::with_client_version`) to exercise the
# minimum-client-version gate. Always enabled for this crate's own tests; production builds never enable it.
client-version-fixture = []
browser-tor = ["ckmg/browser-tor", "cmsh/tor-records", "dep:ctrn"]

[[example]]
name = "client-conformance"
path = "tests/support/client-server.rs"
required-features = ["conformance"]

# v01 integration: first-party dependencies point directly at v01 branches; no [patch] tables.

# Integration tests: ONE binary (tests/it/main.rs) for every suite that shares the plain native/wasm
# harness. Targets stay separate only where the harness requires it: foyer leaves its router running
# past the test, ohttp_keys changes the types every other suite compiles against, pairing_onion_tor
# runs alone inside the private Tor fixture, and initial_tor is executed directly as the fixture's Tor
# probe (it must contain only that journey).
[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "foyer"
path = "tests/foyer.rs"

[[test]]
name = "initial_tor"
path = "tests/initial_tor.rs"
required-features = ["native-tor"]

[[test]]
name = "pairing_onion_tor"
path = "tests/pairing_onion_tor.rs"
required-features = ["private-tor-fixture"]

[[test]]
name = "ohttp_keys"
path = "tests/ohttp_keys.rs"
required-features = ["ohttp"]
